<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intajiyati</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root {
  --bg: #0b0f17; --surface: #121826; --surface2: #182033; --surface3: #1f2a40;
  --border: #ffffff12; --border2: #ffffff22;
  --text: #eef2fb; --muted: #94a0bd; --faint: #5d6885;
  --accent: #ff6b35; --accent-h: #ff8556; --accent-soft: #ff6b3518; --on-accent: #fff;
  --green: #10d9a0; --blue: #4a9eff; --purple: #9b6dff; --yellow: #ffd166; --pink: #ff6b9d; --teal: #2dd4bf;
  --hm1: #0d4a3a; --hm2: #10876a; --hm3: #10d9a0; --hm4: #5dffcf;
  --r: 14px; --r2: 9px; --shadow: 0 10px 40px #00000055;
}
[data-theme="light"] {
  --bg: #f4f6fb; --surface: #ffffff; --surface2: #f3f5fa; --surface3: #e8ecf4;
  --border: #0f172a14; --border2: #0f172a26;
  --text: #111827; --muted: #556077; --faint: #8a94a8;
  --accent: #e8551f; --accent-h: #d24a17; --accent-soft: #e8551f14;
  --green: #059669; --blue: #2563eb; --purple: #7c3aed; --yellow: #b7791f; --pink: #db2777; --teal: #0d9488;
  --hm1: #c7f0e0; --hm2: #7fdcbb; --hm3: #2bb98a; --hm4: #047857;
  --shadow: 0 10px 40px #0f172a1f;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { font-family: 'Inter', 'Cairo', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
[dir="rtl"] body { font-family: 'Cairo', 'Inter', system-ui, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
svg.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.hidden { display: none !important; }

/* Auth */
.auth { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(900px 500px at 50% -10%, var(--accent-soft), transparent 70%), var(--bg); }
.auth-card { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 32px 28px; box-shadow: var(--shadow); }
.auth-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 26px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; }
.brand-mark { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), #ff3d00); display: grid; place-items: center; color: #fff; }
.auth h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
.auth-sub { color: var(--muted); font-size: 13px; margin-bottom: 22px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.auth-links { display: flex; justify-content: space-between; gap: 12px; margin-top: 16px; font-size: 13px; flex-wrap: wrap; }
.link { background: none; border: none; color: var(--accent); cursor: pointer; font-weight: 600; padding: 0; }
.link:hover { text-decoration: underline; }
.msg { font-size: 13px; padding: 10px 12px; border-radius: var(--r2); margin-bottom: 14px; }
.msg.err { background: #ff4d6d1c; color: var(--pink); border: 1px solid #ff4d6d40; }
.msg.ok { background: #10d9a01c; color: var(--green); border: 1px solid #10d9a040; }

/* Inputs & buttons */
input[type=text], input[type=email], input[type=password], input[type=time], input[type=date], input[type=number], select, textarea {
  width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--r2);
  padding: 10px 12px; outline: none; transition: border-color .15s, box-shadow .15s; resize: vertical;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px; border-radius: var(--r2); font-size: 13px; font-weight: 700; cursor: pointer; border: 1px solid transparent; transition: background .15s, border-color .15s, color .15s; white-space: nowrap; }
.btn:focus-visible, .nav-item:focus-visible, .check:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-h); }
.btn-ghost { background: var(--surface2); color: var(--muted); border-color: var(--border2); }
.btn-ghost:hover { color: var(--text); background: var(--surface3); }
.btn-danger { background: #ff4d6d1c; color: var(--pink); border-color: #ff4d6d40; }
.btn-block { width: 100%; padding: 11px 16px; }
.btn[disabled] { opacity: .6; cursor: wait; }
.icon-btn { background: none; border: none; color: var(--faint); cursor: pointer; padding: 4px; border-radius: 6px; display: inline-flex; }
.icon-btn:hover { color: var(--text); background: var(--surface3); }
.icon-btn.danger:hover { color: var(--pink); }
.seg { display: inline-flex; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--r2); padding: 3px; gap: 2px; }
.seg button { background: none; border: none; padding: 5px 11px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 700; color: var(--muted); }
.seg button.on { background: var(--accent); color: var(--on-accent); }

/* Layout */
.sidebar { position: fixed; inset-block: 0; inset-inline-start: 0; width: 240px; background: var(--surface); border-inline-end: 1px solid var(--border); display: flex; flex-direction: column; z-index: 200; transition: transform .25s; }
.sidebar .brand { padding: 20px 18px 16px; border-bottom: 1px solid var(--border); }
.nav { padding: 10px 0; overflow-y: auto; flex: 1; }
.nav-label { padding: 14px 20px 6px; font-size: 10.5px; font-weight: 700; color: var(--faint); text-transform: uppercase; letter-spacing: .08em; }
.nav-item { display: flex; align-items: center; gap: 11px; width: calc(100% - 20px); margin: 2px 10px; padding: 9px 12px; border-radius: var(--r2); cursor: pointer; color: var(--muted); font-size: 13.5px; font-weight: 600; background: none; border: none; text-align: start; transition: background .15s, color .15s; }
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); }
.side-foot { padding: 14px; border-top: 1px solid var(--border); }
.user-chip { display: flex; align-items: center; gap: 10px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 800; flex-shrink: 0; text-transform: uppercase; }
.user-mail { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; text-align: start; }
.sync { font-size: 11px; color: var(--faint); display: flex; align-items: center; gap: 5px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; }
.sync.saving i { background: var(--yellow); } .sync.error i { background: var(--pink); }
.main { margin-inline-start: 240px; padding: 28px; min-height: 100vh; max-width: 1500px; }
.page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.page-title { font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
.page-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grid { display: grid; gap: 16px; margin-bottom: 16px; }
.g4 { grid-template-columns: repeat(4, 1fr); } .g3 { grid-template-columns: repeat(3, 1fr); } .g2 { grid-template-columns: repeat(2, 1fr); } .g21 { grid-template-columns: 2fr 1fr; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
.card-title { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.kpi { font-size: 32px; font-weight: 800; line-height: 1.1; }
.kpi-label { font-size: 12px; color: var(--muted); margin-top: 6px; }
.bar { height: 6px; background: var(--surface3); border-radius: 10px; overflow: hidden; }
.bar > div { height: 100%; border-radius: 10px; transition: width .5s ease; }
.empty { text-align: center; padding: 32px 16px; color: var(--faint); font-size: 13px; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.row:last-child { border-bottom: none; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-size: 13.5px; font-weight: 600; }
.row-title.done { text-decoration: line-through; color: var(--faint); }
.emoji { font-size: 20px; min-width: 28px; text-align: center; }
.check { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--border2); background: var(--surface2); cursor: pointer; display: grid; place-items: center; flex-shrink: 0; color: #fff; font-size: 13px; font-weight: 800; transition: background .15s, border-color .15s; }
.check.on { background: var(--green); border-color: var(--green); }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; background: var(--surface3); color: var(--muted); }
.time { font-size: 12px; color: var(--faint); min-width: 44px; }
.donuts { display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.donut { position: relative; display: grid; place-items: center; }
.donut svg { transform: rotate(-90deg); display: block; }
.donut span { position: absolute; font-weight: 800; }
.heat { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.heat div { aspect-ratio: 1; border-radius: 5px; background: var(--surface3); }
.heat .l1 { background: var(--hm1); } .heat .l2 { background: var(--hm2); } .heat .l3 { background: var(--hm3); } .heat .l4 { background: var(--hm4); }
.legend { display: flex; gap: 4px; align-items: center; font-size: 10px; color: var(--faint); margin-bottom: 10px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.day { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r2); overflow: hidden; display: flex; flex-direction: column; }
.day.today { border-color: var(--accent); }
.day-head { padding: 10px 8px; text-align: center; border-bottom: 1px solid var(--border); }
.day-name { font-size: 12px; font-weight: 700; } .day-date { font-size: 11px; color: var(--faint); }
.day-body { padding: 8px; flex: 1; }
.plan { display: flex; align-items: center; justify-content: space-between; gap: 4px; padding: 4px 7px; margin-bottom: 4px; border-radius: 6px; font-size: 11.5px; font-weight: 600; background: var(--accent-soft); color: var(--accent); word-break: break-word; }
.plan button { background: none; border: none; color: inherit; cursor: pointer; opacity: .6; font-size: 13px; line-height: 1; }
.day input { padding: 6px 8px; font-size: 11.5px; }
.plan .pt { background: none; border: none; color: inherit; cursor: pointer; text-align: start; font: inherit; opacity: 1; flex: 1; }
.plan.pdone .pt { text-decoration: line-through; opacity: .55; }
.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.strip button { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r2); padding: 10px 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; color: var(--muted); }
.strip button.sel { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.strip button.now .dn::after { content: ' •'; color: var(--accent); }
.stat2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.stat2 div { background: var(--surface2); border-radius: var(--r2); padding: 10px; text-align: center; font-size: 11.5px; color: var(--muted); }
.stat2 b { display: block; font-size: 22px; color: var(--text); }
.slider { display: flex; align-items: center; gap: 12px; padding: 9px 0; }
.slider label { width: 84px; font-size: 13px; font-weight: 600; }
.slider input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0; }
.slider output { width: 26px; text-align: center; font-weight: 800; }
.addline { display: flex; gap: 8px; margin-top: 12px; }
.mbars { display: flex; align-items: flex-end; gap: 10px; height: 120px; }
.mbars > div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; font-size: 11px; color: var(--muted); }
.mbars .g { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 3px; }
.mbars .g i { width: 22%; max-width: 12px; border-radius: 3px 3px 0 0; display: block; }
.check.sm { width: 19px; height: 19px; border-radius: 5px; font-size: 10px; border-width: 1.5px; margin: auto; }
table.mg { border-collapse: collapse; font-size: 11px; }
table.mg th { padding: 3px 2px; color: var(--faint); font-weight: 600; min-width: 25px; }
table.mg th.now { color: var(--accent); }
table.mg td { padding: 3px 2px; text-align: center; }
table.mg tr > :first-child { position: sticky; inset-inline-start: 0; background: var(--surface); text-align: start; white-space: nowrap; padding-inline-end: 12px; font-size: 12.5px; font-weight: 600; z-index: 1; color: var(--text); }
table.mg tfoot td { color: var(--muted); border-top: 1px solid var(--border); padding-top: 8px; font-size: 9.5px; }
.kanban { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.kcol { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r); padding: 14px; min-height: 160px; }
.kcol.over { border-color: var(--accent); }
.kcol-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-weight: 700; font-size: 13px; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.kcard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r2); padding: 12px; margin-bottom: 8px; cursor: grab; }
.kcard:hover { border-color: var(--border2); }
.kcard-title { font-size: 13px; font-weight: 600; word-break: break-word; }
.kcard.kdone .kcard-title { text-decoration: line-through; color: var(--faint); }
.kadd { width: 100%; padding: 8px; background: transparent; border: 1px dashed var(--border2); border-radius: var(--r2); color: var(--faint); cursor: pointer; font-size: 12px; font-weight: 600; }
.kadd:hover { color: var(--accent); border-color: var(--accent); }
.pcard { cursor: pointer; }
.fkpi { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.fkpi .fi { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; }
.range { display: flex; gap: 6px; align-items: center; }
.range input { width: 150px; padding: 8px 10px; font-size: 12.5px; }
table.ft { width: 100%; border-collapse: collapse; min-width: 640px; }
table.ft th { text-align: start; padding: 10px 12px; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--border2); white-space: nowrap; }
table.ft td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
table.ft tr:last-child td { border-bottom: none; }
table.ft .amt { font-weight: 700; white-space: nowrap; }
table.mx { border-collapse: collapse; width: 100%; min-width: 980px; font-size: 12px; }
table.mx th { padding: 9px 8px; font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--border2); text-align: end; white-space: nowrap; }
table.mx th:nth-child(-n+2), table.mx td:nth-child(-n+2) { text-align: start; }
table.mx td { padding: 8px; border-bottom: 1px solid var(--border); text-align: end; white-space: nowrap; }
table.mx td.z { color: var(--faint); }
table.mx tr.sec td { font-weight: 800; font-size: 11px; letter-spacing: .06em; text-align: start; }
table.mx tr.sub td { color: var(--muted); background: var(--surface2); font-weight: 600; }
table.mx tr.tot td { font-weight: 800; border-top: 2px solid var(--border2); border-bottom: none; }
table.mx td:last-child, table.mx th:last-child { font-weight: 800; }
.dist { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; font-size: 12.5px; }
.dist span:first-child { display: flex; align-items: center; gap: 8px; min-width: 0; }
.chart text { font-size: 10px; fill: var(--muted); font-family: inherit; }
.pcard.sel { box-shadow: 0 0 0 2px var(--accent); }
.kcard-meta { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
.kcard-actions { margin-inline-start: auto; display: flex; }
.tag { padding: 2px 8px; border-radius: 20px; font-size: 10.5px; font-weight: 700; }
.note { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r2); padding: 14px; margin-bottom: 10px; cursor: pointer; width: 100%; text-align: start; display: block; }
.note:hover, .note.sel { border-color: var(--accent); }
.note-prev { font-size: 12px; color: var(--muted); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.vbars { display: flex; align-items: flex-end; gap: 14px; height: 130px; }
.vbars > div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%; font-size: 11px; color: var(--muted); }
.vbars i { width: 100%; border-radius: 6px 6px 0 0; display: block; min-height: 3px; }
.ach { display: flex; gap: 12px; flex-wrap: wrap; }
.ach > div { border: 1px solid var(--border); border-radius: var(--r); padding: 16px; min-width: 130px; text-align: center; background: var(--surface2); }
.ach > div.locked { opacity: .4; filter: grayscale(1); }
table.wk { width: 100%; border-collapse: collapse; min-width: 620px; }
table.wk th { padding: 8px; font-size: 11px; color: var(--muted); font-weight: 700; }
table.wk td { padding: 6px; text-align: center; border-top: 1px solid var(--border); }
table.wk td:first-child, table.wk th:first-child { text-align: start; font-size: 12.5px; font-weight: 600; }
.mood { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.mood button { padding: 6px 11px; border-radius: 20px; cursor: pointer; font-size: 18px; border: 2px solid var(--border2); background: var(--surface2); }
.mood button.on { border-color: var(--accent); background: var(--accent-soft); }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.set-row:last-child { border-bottom: none; }
.set-row small { display: block; color: var(--muted); font-size: 12px; }

/* Modal */
.overlay { position: fixed; inset: 0; background: #000000a0; z-index: 500; display: grid; place-items: center; padding: 20px; overflow-y: auto; overscroll-behavior: contain; }
.modal { width: 100%; max-width: 420px; max-height: calc(100vh - 40px); max-height: calc(100dvh - 40px); overflow-y: auto; overscroll-behavior: contain; background: var(--surface); border: 1px solid var(--border2); border-radius: 16px; padding: 24px; box-shadow: var(--shadow); }
.modal h3 { font-size: 16px; font-weight: 800; margin-bottom: 16px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; position: sticky; bottom: -24px; background: var(--surface); padding: 12px 0 4px; margin-bottom: -4px; }
.modal .flag-prev { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 13px; color: var(--muted); min-height: 30px; }
img.flag { display: inline-block; object-fit: cover; border-radius: 4px; box-shadow: 0 0 0 1px #0000001f, 0 4px 12px -6px #000a; vertical-align: middle; background: var(--surface3); }

.menu-toggle { position: fixed; bottom: 18px; inset-inline-end: 18px; width: 50px; height: 50px; border-radius: 50%; background: var(--accent); color: #fff; border: none; cursor: pointer; display: none; z-index: 300; place-items: center; box-shadow: var(--shadow); }
/* Dreams & goals */
.tagbtn { border: none; cursor: pointer; font-family: inherit; }
.star { font-size: 17px; line-height: 1; color: var(--faint); }
.star.on { color: var(--yellow); }
.quad { border-top: 3px solid; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--surface2); border: 1px solid var(--border2); border-radius: 20px; padding: 5px 11px; font-size: 12.5px; font-weight: 600; cursor: pointer; max-width: 100%; }
.chip:hover { border-color: var(--accent); }
.chip.done { text-decoration: line-through; color: var(--faint); }
.dump { display: flex; gap: 8px; }
.dump select { max-width: 150px; }
.mm-wrap { overflow-x: auto; }
.mm { width: 100%; min-width: 760px; height: auto; display: block; }
.mm .n { cursor: pointer; }
.mm .n:hover circle { stroke-width: 3; }
.mm .n:hover text.lb { fill: var(--accent); }
.trips { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.trip { display: flex; flex-direction: column; gap: 10px; }
.trip-top { display: flex; gap: 12px; align-items: flex-start; }
.trip-flag { font-size: 34px; line-height: 1; }
.trip-meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted); }
.lrow { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.lrow:last-child { border-bottom: none; }
@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, 1fr); } .week { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 900px) {
  [dir="rtl"] .sidebar { transform: translateX(100%); } [dir="ltr"] .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: none !important; box-shadow: var(--shadow); }
  .main { margin-inline-start: 0; padding: 18px 16px 80px; }
  .g3, .g2, .g21, .kanban { grid-template-columns: 1fr; }
  .menu-toggle { display: grid; }
  .notes-grid .ne { order: -1; }
  .strip { grid-template-columns: repeat(7, 70px); overflow-x: auto; padding-bottom: 4px; }
  .slider label { width: 96px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
/* ───────── Motion ───────── */
@property --ang { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
body::before { content: ''; position: fixed; inset: -20%; z-index: -1; pointer-events: none; background: radial-gradient(40% 35% at 20% 20%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 70%), radial-gradient(35% 30% at 80% 30%, color-mix(in srgb, var(--purple) 10%, transparent), transparent 70%), radial-gradient(40% 35% at 50% 90%, color-mix(in srgb, var(--blue) 9%, transparent), transparent 70%); animation: aurora 28s ease-in-out infinite alternate; }
@keyframes aurora { 0% { transform: translate(0, 0) rotate(0); } 50% { transform: translate(3%, -2%) rotate(6deg); } 100% { transform: translate(-3%, 2%) rotate(-5deg); } }
@keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); } }
@keyframes fadein { from { opacity: 0; } }
@keyframes pop { 0% { opacity: 0; transform: scale(.4); } 70% { transform: scale(1.08); } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes donut { from { stroke-dasharray: 0 100; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes floaty { 50% { transform: translateY(-8px); } }
@keyframes wave { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-12deg) scale(1.1); } 75% { transform: rotate(10deg) scale(1.1); } }
@keyframes starpop { 0% { transform: scale(1); } 40% { transform: scale(1.8) rotate(-20deg); filter: drop-shadow(0 0 8px var(--yellow)); } 100% { transform: scale(1) rotate(0); } }
@keyframes flash { 0%, 30% { background: color-mix(in srgb, var(--accent) 22%, transparent); } }
@keyframes ang { to { --ang: 360deg; } }
@keyframes pulse { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(1.7); opacity: 0; } }
@keyframes glowp { 50% { opacity: .9; } }
.main.anim .page-header, .main.anim .hero { animation: rise .55s cubic-bezier(.2, .7, .2, 1) backwards; }
.main.anim .card, .main.anim .trip, .main.anim table tbody tr { animation: rise .55s cubic-bezier(.2, .7, .2, 1) backwards; animation-delay: calc(80ms + var(--i, 0) * 45ms); }
.main.anim .chip { animation: pop .45s cubic-bezier(.2, .7, .2, 1) backwards; animation-delay: calc(250ms + var(--i, 0) * 35ms); }
.main.anim .bar > div { animation: grow 1s cubic-bezier(.2, .7, .2, 1) backwards; animation-delay: .25s; }
.bar > div { transform-origin: left; } [dir="rtl"] .bar > div { transform-origin: right; }
.main.anim .donut circle + circle { animation: donut 1.1s cubic-bezier(.2, .7, .2, 1) backwards; animation-delay: .2s; }
.btn { position: relative; overflow: hidden; transition: background .15s, border-color .15s, transform .15s, box-shadow .2s; }
.btn:active { transform: scale(.96); }
.btn-primary { background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 70%, var(--pink))); box-shadow: 0 6px 20px -8px var(--accent); }
.btn-primary:hover { box-shadow: 0 10px 28px -8px var(--accent); }
.btn-primary::after { content: ''; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, #ffffff55 50%, transparent 70%); transform: translateX(-120%); transition: transform .7s; pointer-events: none; }
.btn-primary:hover::after { transform: translateX(120%); }
.nav-item svg { transition: transform .25s cubic-bezier(.2, .7, .2, 1.4); }
.nav-item:hover svg { transform: scale(1.18) rotate(-8deg); }
.nav-item.active { box-shadow: inset 3px 0 0 var(--accent); } [dir="rtl"] .nav-item.active { box-shadow: inset -3px 0 0 var(--accent); }
.brand-mark { box-shadow: 0 0 0 0 var(--accent); animation: brandglow 3.5s ease-in-out infinite; }
@keyframes brandglow { 50% { box-shadow: 0 0 22px -2px var(--accent); } }
.tilt, .g4 > .card { transition: transform .25s ease, box-shadow .25s, border-color .25s; position: relative; will-change: transform; }
.tilt:hover, .g4 > .card:hover { box-shadow: 0 18px 40px -18px #000a; border-color: var(--border2); }
.tilt::after, .g4 > .card::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .3s; background: radial-gradient(300px circle at var(--mx, 50%) var(--my, 50%), color-mix(in srgb, var(--accent) 14%, transparent), transparent 60%); }
.tilt:hover::after, .g4 > .card:hover::after { opacity: 1; }
.tagbtn { transition: transform .15s; } .tagbtn:hover { transform: scale(1.1); }
.star { transition: transform .15s; } .star:hover { transform: scale(1.25); }
.star.pop { animation: starpop .7s cubic-bezier(.2, .7, .2, 1); }
tr.flash td, .chip.flash { animation: flash 1.8s ease-out; }
.chip { transition: transform .2s, border-color .2s, box-shadow .2s; }
.chip:hover { transform: translateY(-2px); box-shadow: 0 6px 16px -8px var(--accent); }
.glow { border: 1px solid transparent; background: linear-gradient(var(--surface), var(--surface)) padding-box, conic-gradient(from var(--ang), var(--accent), var(--purple), var(--blue), var(--green), var(--accent)) border-box; animation: ang 6s linear infinite; }
.trip:hover .trip-flag { animation: wave 1s ease-in-out; }
.floaty { display: inline-block; animation: floaty 4s ease-in-out infinite; }
.confetti { position: fixed; width: 8px; height: 12px; border-radius: 2px; z-index: 9999; pointer-events: none; }
/* hero */
.hero { position: relative; overflow: hidden; border-radius: 20px; border: 1px solid var(--border2); background: var(--surface); padding: 26px 28px; margin-bottom: 20px; display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; min-height: 190px; isolation: isolate; }
.hero-bg { position: absolute; inset: -60%; z-index: -1; background: conic-gradient(from 0deg at 50% 50%, color-mix(in srgb, var(--accent) 30%, transparent), color-mix(in srgb, var(--purple) 26%, transparent), color-mix(in srgb, var(--blue) 26%, transparent), color-mix(in srgb, var(--green) 20%, transparent), color-mix(in srgb, var(--accent) 30%, transparent)); filter: blur(50px); opacity: .8; animation: spin 26s linear infinite; }
.hero::after { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, color-mix(in srgb, var(--surface) 80%, transparent) 15%, transparent 85%); }
[dir="rtl"] .hero::after { background: linear-gradient(-90deg, color-mix(in srgb, var(--surface) 80%, transparent) 15%, transparent 85%); }
.hero .page-title { font-size: 30px; background: linear-gradient(90deg, var(--text), var(--accent), var(--purple), var(--text)); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 8s linear infinite; }
@keyframes shine { to { background-position: 300% 0; } }
.hero-stats { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.hero-stats span { background: color-mix(in srgb, var(--surface2) 80%, transparent); border: 1px solid var(--border2); border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: 700; backdrop-filter: blur(6px); }
.hero-art svg { display: block; width: 300px; height: auto; overflow: visible; }
.hero-art .rays { transform-box: fill-box; transform-origin: center; animation: spin 18s linear infinite; }
.hero-art .pulse, .mm .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
.hero-art .dash { stroke-dasharray: 6 8; animation: dashmove 1.2s linear infinite; }
@keyframes dashmove { to { stroke-dashoffset: -28; } }
.hero-art .bob { animation: floaty 4s ease-in-out infinite; }
/* mind map motion */
.main.anim .mm .br { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .9s cubic-bezier(.4, 0, .2, 1) forwards; animation-delay: calc(var(--d, 0) * 1ms); }
.main.anim .mm .n { animation: pop .55s cubic-bezier(.2, .7, .2, 1.3) backwards; animation-delay: calc(var(--d, 0) * 1ms); }
.mm .n { transform-box: fill-box; transform-origin: center; transition: transform .2s; }
.mm .n:hover { transform: scale(1.12); }
.mm .orbit { transform-box: fill-box; transform-origin: center; animation: spin 30s linear infinite; }
.mm .core { transform-box: fill-box; transform-origin: center; animation: glowp 3s ease-in-out infinite; opacity: .7; }
@media (max-width: 900px) { .hero { grid-template-columns: 1fr; padding: 22px 18px; } .hero-art svg { width: 100%; max-width: 320px; margin: auto; } .hero .page-title { font-size: 25px; } }


/* ───────── Dashboard hero ───────── */
.dhero { position: relative; border-radius: 22px; overflow: hidden; min-height: 300px; margin-bottom: 20px; border: 1px solid var(--border2); isolation: isolate; color: #fff; }
.dhero-scene, .dhero-scene .scene { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -2; }
[dir="rtl"] .dhero-scene .scene { transform: scaleX(-1); }
.dhero-shade { position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, #0b0f17e6 0%, #0b0f17a8 38%, transparent 70%); }
[dir="rtl"] .dhero-shade { background: linear-gradient(-90deg, #0b0f17e6 0%, #0b0f17a8 38%, transparent 70%); }
.dhero-in { padding: 26px 28px; max-width: 620px; }
.dhero-hi { font-size: 30px; font-weight: 800; letter-spacing: -.01em; animation: rise .7s cubic-bezier(.2, .7, .2, 1) backwards; }
.dhero-date { color: #ffffffc0; font-size: 13.5px; margin-top: 2px; animation: rise .7s .1s cubic-bezier(.2, .7, .2, 1) backwards; }
.dhero-date b { color: var(--yellow); }
.dhero-summit { display: inline-flex; gap: 10px; align-items: center; margin-top: 14px; background: #ffffff1a; border: 1px solid #ffffff2a; border-radius: 20px; padding: 5px 14px; font-size: 12.5px; font-weight: 700; backdrop-filter: blur(8px); animation: rise .7s .2s cubic-bezier(.2, .7, .2, 1) backwards; }
.dhero-summit b { color: var(--accent); font-size: 15px; }
.tipbox { margin-top: 14px; background: #0b0f1780; border: 1px solid #ffffff22; border-radius: 16px; padding: 14px 16px; backdrop-filter: blur(12px); max-width: 560px; }
.tip-in { animation: rise .6s .3s cubic-bezier(.2, .7, .2, 1) backwards; }
.tip-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 11.5px; font-weight: 800; letter-spacing: .03em; }
.tip-lbl { color: #ffffff90; margin-inline-start: auto; }
.tip-next { color: #fff !important; font-size: 17px; line-height: 1; transition: transform .4s; }
.tip-next:hover { transform: rotate(180deg); background: #ffffff22 !important; }
.tip-txt { font-size: 15px; font-weight: 600; line-height: 1.7; }
.insights { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; animation: rise .7s .45s cubic-bezier(.2, .7, .2, 1) backwards; }
.insight { background: #ffffff14; border: 1px solid #ffffff26; color: #fff; border-radius: 20px; padding: 6px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; backdrop-filter: blur(8px); transition: background .2s, transform .2s; text-align: start; }
.insight:hover { background: #ffffff2a; transform: translateY(-2px); }
.scene .twinkle { animation: twinkle 3.5s ease-in-out infinite; }
@keyframes twinkle { 50% { opacity: .15; } }
.scene .breath { transform-box: fill-box; transform-origin: center; animation: breath 5s ease-in-out infinite; }
@keyframes breath { 50% { transform: scale(1.15); } }
.scene .cloud { animation: drift 60s linear infinite; } .scene .c2 { animation-duration: 85s; animation-delay: -30s; } .scene .c3 { animation-duration: 70s; animation-delay: -50s; }
@keyframes drift { from { transform: translateX(-300px); } to { transform: translateX(1300px); } }
.scene .trail { animation: dashmove 1.4s linear infinite; }
.scene .trail-done { filter: drop-shadow(0 0 6px var(--accent)); }
.main.anim .scene .trail-done { animation: traildraw 2.6s cubic-bezier(.3, 0, .2, 1) backwards; }
@keyframes traildraw { from { stroke-dasharray: 0 1; } }
.scene .flag-cloth { transform-box: fill-box; transform-origin: left center; animation: wave 2.2s ease-in-out infinite; }
.scene .far { animation: floaty 14s ease-in-out infinite; }
.scene .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
@media (max-width: 900px) { .dhero { min-height: 380px; } .dhero-shade, [dir="rtl"] .dhero-shade { background: linear-gradient(180deg, #0b0f17d9 0%, #0b0f17a0 55%, #0b0f1740 100%); } .dhero-in { padding: 20px 18px 120px; } .dhero-hi { font-size: 24px; } .dhero-scene .scene { height: 100%; } }

/* ───────── Monthly plan ───────── */
.mgroup { margin-bottom: 18px; }
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.mcard { padding: 16px; }
.mcat { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-size: 21px; flex-shrink: 0; transition: transform .3s; }
.mcard:hover .mcat { transform: rotate(-8deg) scale(1.1); }
.mtitle { font-weight: 800; font-size: 14.5px; }
.mdone .mtitle { text-decoration: line-through; color: var(--faint); }
.mdone { opacity: .78; }
.mstep { width: 30px; height: 30px; border-radius: 9px; border: 1px solid var(--border2); background: var(--surface2); cursor: pointer; font-size: 17px; font-weight: 800; color: var(--text); flex-shrink: 0; transition: transform .15s, background .15s; }
.mstep:hover { background: var(--surface3); } .mstep:active { transform: scale(.88); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr) 30px; gap: 4px; }
.cal-h { text-align: center; font-size: 11px; font-weight: 700; color: var(--faint); padding-bottom: 4px; }
.cal-d { position: relative; aspect-ratio: 1; border-radius: 8px; background: linear-gradient(to top, color-mix(in srgb, var(--green) 55%, transparent) var(--h), var(--surface2) var(--h)); border: 1px solid var(--border); min-width: 0; }
.cal-d.empty { background: none; border: none; }
.cal-d.fut { opacity: .45; }
.cal-d.now { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.cal-n { position: absolute; inset: 0; background: none; border: none; cursor: pointer; font-size: 12px; font-weight: 700; color: var(--text); padding: 3px 0 0; display: flex; justify-content: center; align-items: flex-start; }
.cal-n:hover { color: var(--accent); }
.cal-mom { position: absolute; top: -5px; inset-inline-end: -4px; font-size: 10px; font-style: normal; }
.cal-ch { position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--pink); background: var(--surface); font-size: 9px; color: #fff; cursor: pointer; display: grid; place-items: center; padding: 0; line-height: 1; transition: transform .15s; }
.cal-ch.on { background: var(--pink); }
.cal-ch:hover { transform: translateX(-50%) scale(1.2); }
.cal-w { background: none; border: none; color: var(--yellow); cursor: pointer; font-size: 12px; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; line-height: 1.1; border-radius: 8px; }
.cal-w:hover { background: var(--surface2); }
.main.anim .cal-d { animation: pop .4s cubic-bezier(.2, .7, .2, 1.2) backwards; animation-delay: calc(200ms + var(--i, 0) * 12ms); }
.mini { display: flex; flex-direction: column; gap: 2px; background: var(--surface2); border-radius: 10px; padding: 8px 10px; flex: 1; min-width: 0; }
.mini span { font-size: 11px; color: var(--muted); } .mini b { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* ───────── My year ───────── */
.yword { display: block; background: none; border: none; cursor: pointer; padding: 0; margin-top: 12px; text-align: start; }
.yword-txt { font-size: 26px; font-weight: 800; letter-spacing: .02em; background: linear-gradient(90deg, var(--yellow), var(--accent), var(--pink), var(--yellow)); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 6s linear infinite; }
.yword-txt::before { content: '« '; } .yword-txt::after { content: ' »'; }
.ytabs button { padding: 8px 16px; font-size: 13px; }
.goals { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.grange { width: 100%; margin-top: 12px; accent-color: var(--c); }
.qgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 14px; }
.qchip { background: var(--surface2); border: 1px solid var(--border2); border-radius: 9px; padding: 6px 7px; font-size: 11px; text-align: start; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; transition: transform .15s, background .2s, border-color .2s; }
.qchip span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.35; }
.qchip:hover { transform: translateY(-2px); }
.qchip.cur { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.qchip.on { background: color-mix(in srgb, var(--green) 16%, transparent); border-color: color-mix(in srgb, var(--green) 50%, transparent); }
.qchip.on b { color: var(--green); }
.qchip.empty { cursor: default; opacity: .35; }
.wheel { width: 100%; max-width: 280px; display: block; margin: auto; overflow: visible; }
.wedge { transform-box: view-box; transform-origin: 50% 50%; transition: opacity .2s; }
.wedge:hover { opacity: 1 !important; filter: brightness(1.15); }
.main.anim .wedge { animation: pop .8s cubic-bezier(.2, .7, .2, 1.2) backwards; animation-delay: calc(300ms + var(--i) * 70ms); }
.wheel-legend { display: flex; flex-wrap: wrap; gap: 6px 12px; justify-content: center; margin-top: 10px; font-size: 12px; color: var(--muted); }
.wheel-legend span { display: inline-flex; align-items: center; gap: 5px; }
@keyframes ringin { from { stroke-dasharray: 0 var(--c); } }
.main.anim .ringv { animation: ringin 1.4s cubic-bezier(.2, .7, .2, 1) backwards; animation-delay: .3s; }
.hero-art svg[viewBox="-110 -100 220 200"] { width: 240px; }
/* letter */
.env { position: relative; height: 130px; border-radius: 12px; background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 30%, var(--surface2)), var(--surface2)); border: 1px solid var(--border2); overflow: hidden; perspective: 600px; }
.env::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to top right, transparent 49.5%, var(--border2) 50%, transparent 50.5%), linear-gradient(to top left, transparent 49.5%, var(--border2) 50%, transparent 50.5%); }
.env-flap { position: absolute; inset: 0 0 45% 0; background: color-mix(in srgb, var(--accent) 40%, var(--surface3)); clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top; transition: transform .6s; }
.env.ready:hover .env-flap { transform: rotateX(160deg); }
.env-seal { position: absolute; left: 50%; top: 55%; transform: translate(-50%, -50%); width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; background: radial-gradient(circle at 35% 35%, #ff8a5c, #c2410c); box-shadow: 0 6px 16px -4px #c2410caa; animation: brandglow 2.6s ease-in-out infinite; }
.paper { background: linear-gradient(var(--surface2), var(--surface2)) padding-box; border: 1px dashed var(--border2); border-radius: 10px; padding: 16px; animation: letterup .9s cubic-bezier(.2, .7, .2, 1); }
@keyframes letterup { from { opacity: 0; transform: translateY(40px) rotate(-2deg) scale(.95); } }
/* moments timeline */
.tl { position: relative; padding-inline-start: 4px; }
.tl::before { content: ''; position: absolute; inset-block: 8px; inset-inline-start: 21px; width: 2px; background: linear-gradient(var(--accent), var(--purple), var(--blue)); opacity: .5; }
.tl-item { position: relative; display: flex; gap: 14px; align-items: center; padding: 10px 6px; border-radius: 10px; }
.tl-dot { width: 36px; height: 36px; border-radius: 50%; background: var(--surface2); border: 2px solid var(--accent); display: grid; place-items: center; font-size: 17px; flex-shrink: 0; z-index: 1; }
.tl-body { flex: 1; min-width: 0; }
.main.anim .tl-item { animation: rise .5s cubic-bezier(.2, .7, .2, 1) backwards; }
.main.anim .tl-item:nth-child(n) { animation-delay: calc(120ms + var(--i, 0) * 40ms); }
.tl-item.flash { animation: flash 1.8s ease-out; }
/* review */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
.step { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; cursor: pointer; font-weight: 700; font-size: 13px; color: var(--muted); transition: all .25s; }
.step-n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface3); flex-shrink: 0; transition: all .25s; }
.step.on { border-color: var(--accent); color: var(--text); box-shadow: 0 8px 24px -14px var(--accent); }
.step.on .step-n { background: var(--accent); color: #fff; transform: scale(1.1); }
.step.past .step-n { background: var(--green); color: #fff; }
.rsub { color: var(--muted); margin-bottom: 14px; }
.rrow { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
.rrow:last-of-type { border-bottom: none; }
.rcard { animation: rise .45s cubic-bezier(.2, .7, .2, 1); }
/* wrapped */
.wrap { position: fixed; inset: 0; z-index: 900; display: grid; place-items: center; color: #fff; overflow: hidden; }

/* ───────── Actions ───────── */
function toggle(log, k, id) { const a = log[k] || (log[k] = []), i = a.indexOf(id); i < 0 ? a.push(id) : a.splice(i, 1); if (!a.length) delete log[k]; }
function toggleHabit(id, k) { toggle(S.habitLog, k, id); commit(); }
function toggleRoutine(id) { toggle(S.routineLog, selDay || today(), id); commit(); }
function setMood(i) { S.mood[today()] = i; commit(); }
function setHabitView(v) { habitView = v; render(); }
function addHabit() { openForm({ title: t('addHabit'), submit: t('add'), fields: [{ name: 'name', label: t('habitName'), required: true, max: 60 }, { name: 'emoji', label: t('emoji'), value: '✅', max: 8 }], onSubmit: v => { if (!v.name) return; S.habits.push({ id: uid(), name: v.name, emoji: v.emoji || '✅', color: PALETTE[S.habits.length % PALETTE.length] }); commit(); } }); }
function delHabit(id) { confirmDel(() => { S.habits = S.habits.filter(h => h.id !== id); }); }
function addRoutine(part) { openForm({ title: t('addItem'), submit: t('add'), fields: [{ name: 'time', label: t('time'), type: 'time', value: part === 'morning' ? '07:00' : '18:00', required: true }, { name: 'task', label: t('task'), required: true, max: 80 }, { name: 'emoji', label: t('emoji'), value: '📌', max: 8 }], onSubmit: v => { if (!v.task) return; S.routine[part].push({ id: uid(), time: v.time, task: v.task, emoji: v.emoji || '📌' }); S.routine[part].sort((a, b) => a.time.localeCompare(b.time)); commit(); } }); }
function delRoutine(part, id) { confirmDel(() => { S.routine[part] = S.routine[part].filter(i => i.id !== id); }); }
function shiftWeek(n) { weekOffset = n === 0 ? 0 : weekOffset + n; render(); }
function setWeek(f, v) { weekData()[f] = v; save(); }
function setPriority(i, v) { weekData().p[i] = v; save(); }
function setScore(n) { const w = weekData(); w.score = w.score === n ? 0 : n; commit(); }
function addDayTask(dk, v) { v = (v || '').trim(); if (!v) return; (S.dayTasks[dk] || (S.dayTasks[dk] = [])).push({ id: uid(), title: v, done: false }); commit(); }
function toggleDayTask(dk, id) { const x = dayTasks(dk).find(q => q.id === id); if (x) { x.done = !x.done; commit(); } }
function delDayTask(dk, id) { S.dayTasks[dk] = dayTasks(dk).filter(q => q.id !== id); if (!S.dayTasks[dk].length) delete S.dayTasks[dk]; commit(); }
function setDay(k) { selDay = k && k !== today() ? k : null; render(); }
function shiftDay(n) { setDay(dkey(addDays(pdate(selDay || today()), n))); }
function shiftMonth(n) { monthOffset += n; render(); }
function setMind(f, v, el) { const k = selDay || today(), m = S.mind[k] || (S.mind[k] = { e: 5, f: 5, m: 5 }); m[f] = Number(v); if (el) el.nextElementSibling.textContent = v; save(); }
function editHabit(id) { const h = S.habits.find(q => q.id === id); if (!h) return; openForm({ title: t('edit'), fields: [{ name: 'name', label: t('habitName'), value: h.name, required: true, max: 60 }, { name: 'emoji', label: t('emoji'), value: h.emoji, max: 8 }], onSubmit: v => { if (!v.name) return; h.name = v.name; h.emoji = v.emoji || h.emoji; commit(); } }); }
function editRoutine(part, id) { const r = S.routine[part].find(q => q.id === id); if (!r) return; openForm({ title: t('edit'), fields: [{ name: 'time', label: t('time'), type: 'time', value: r.time, required: true }, { name: 'task', label: t('task'), value: r.task, required: true, max: 80 }, { name: 'emoji', label: t('emoji'), value: r.emoji, max: 8 }], onSubmit: v => { if (!v.task) return; r.time = v.time || r.time; r.task = v.task; r.emoji = v.emoji || r.emoji; S.routine[part].sort((a, b) => a.time.localeCompare(b.time)); commit(); } }); }
function editTask(id) { const x = S.tasks.find(q => q.id === id); if (!x) return; openForm({ title: t('edit'), fields: [{ name: 'title', label: t('taskTitle'), value: x.title, required: true, max: 120 }, { name: 'projectId', label: t('project'), type: 'select', value: x.projectId || '', options: [['', t('none')], ...S.projects.map(p => [p.id, p.name])] }, { name: 'priority', label: t('priority'), type: 'select', value: x.priority || 'med', options: [['high', t('high')], ['med', t('med')], ['low', t('low')]] }], onSubmit: v => { if (!v.title) return; x.title = v.title; x.projectId = v.projectId; x.priority = v.priority; commit(); } }); }

function mCalendar(k, d) {

PAGES.monthly = function () {
